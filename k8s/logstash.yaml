---
# Logstash ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: biblio
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]
    path.config: /usr/share/logstash/pipeline

  logstash.conf: |
    input {
      # TCP input for Spring Boot logs (JSON format)
      tcp {
        port => 5000
        codec => json_lines
        tags => ["spring-boot"]
      }

      # UDP input for syslog-style logs
      udp {
        port => 5000
        codec => json_lines
        tags => ["spring-boot"]
      }

      # Beats input for Filebeat
      beats {
        port => 5044
      }
    }

    filter {
      # Parse Spring Boot logs
      if "spring-boot" in [tags] {
        # Add service name from the log
        if [service] {
          mutate {
            add_field => { "service_name" => "%{service}" }
          }
        }
        
        # Parse timestamp
        date {
          match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss"]
          target => "@timestamp"
        }
        
        # Parse log level
        if [level] {
          mutate {
            add_field => { "log_level" => "%{level}" }
          }
        }
        
        # Extract exception details
        if [stack_trace] {
          mutate {
            add_field => { "has_exception" => "true" }
          }
        }
        
        # Add kubernetes metadata
        mutate {
          add_field => {
            "cluster" => "biblio-k8s"
            "namespace" => "biblio"
          }
        }
      }

      # Parse container logs from Kubernetes
      if [kubernetes] {
        mutate {
          add_field => { 
            "container_name" => "%{[kubernetes][container][name]}"
            "pod_name" => "%{[kubernetes][pod][name]}"
            "namespace" => "%{[kubernetes][namespace]}"
          }
        }
      }

      # Remove unnecessary fields
      mutate {
        remove_field => ["host", "agent"]
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "biblio-logs-%{+YYYY.MM.dd}"
        manage_template => true
        template_name => "biblio-logs"
        template_overwrite => true
      }

      # Debug output (optional - disable in production)
      # stdout { codec => rubydebug }
    }
---
# Logstash Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: biblio
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.0
          ports:
            - containerPort: 5044
              name: beats
            - containerPort: 5000
              name: tcp
              protocol: TCP
            - containerPort: 5000
              name: udp
              protocol: UDP
            - containerPort: 9600
              name: http
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
      volumes:
        - name: config
          configMap:
            name: logstash-config
            items:
              - key: logstash.yml
                path: logstash.yml
        - name: pipeline
          configMap:
            name: logstash-config
            items:
              - key: logstash.conf
                path: logstash.conf
---
# Logstash Service
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: biblio
  labels:
    app: logstash
spec:
  type: ClusterIP
  ports:
    - port: 5044
      targetPort: 5044
      protocol: TCP
      name: beats
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: tcp
    - port: 9600
      targetPort: 9600
      protocol: TCP
      name: http
  selector:
    app: logstash
