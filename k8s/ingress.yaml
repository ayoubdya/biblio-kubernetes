---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biblio-ingress
  namespace: biblio
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: biblio.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
      - path: /api/catalog
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: 8080
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081
      - path: /api/comments
        pathType: Prefix
        backend:
          service:
            name: comment-service
            port:
              number: 8082
  # tls:
  # - hosts:
  #   - biblio.yourdomain.com
  #   secretName: biblio-tls
