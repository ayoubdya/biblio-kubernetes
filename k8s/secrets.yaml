# IMPORTANT: Ne jamais commiter ce fichier avec de vraies valeurs!
# Utiliser kubectl create secret ou des outils comme Sealed Secrets en production
apiVersion: v1
kind: Secret
metadata:
  name: biblio-secrets
  namespace: biblio
type: Opaque
stringData:
  # Database Credentials
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"

  # Keycloak Admin Credentials
  KEYCLOAK_ADMIN_USER: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"

  # Keycloak Database Password
  KEYCLOAK_DB_PASSWORD: "keycloak"

  # NextAuth Secret (générer avec: openssl rand -base64 32)
  NEXTAUTH_SECRET: "your-nextauth-secret-change-this-in-production"

  # Grafana Admin Password
  GRAFANA_ADMIN_PASSWORD: "admin123"

  # Elasticsearch (if security enabled)
  ELASTIC_PASSWORD: "changeme"
