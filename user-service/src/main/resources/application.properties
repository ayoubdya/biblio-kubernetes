# Database Configuration
spring.application.name=user-service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/biblio/protocol/openid-connect/certs}

# Server Configuration
server.port=${SERVER_PORT:8081}

# Logging
logging.level.com.biblio.userservice=INFO
logging.level.org.springframework.security=INFO

# Keycloak Admin Configuration
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.admin.realm=biblio
keycloak.admin.client-id=admin-cli
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# Actuator and Prometheus Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Application info for metrics
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=User Service for Biblio Application
info.app.version=1.0.0
