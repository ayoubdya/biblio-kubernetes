spring.application.name=catalog-service

server.port=8080

openlibrary.api.base-url=https://openlibrary.org
openlibrary.api.covers-url=https://covers.openlibrary.org/b

logging.level.com.example.catalog_service=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Prometheus metrics path
management.endpoints.web.base-path=/actuator
management.prometheus.metrics.export.enabled=true

# Application info for metrics
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Catalog Service for Biblio Application
info.app.version=1.0.0
