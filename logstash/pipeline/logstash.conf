input {
  # TCP input for Spring Boot logs (JSON format)
  tcp {
    port => 5000
    codec => json_lines
    tags => ["spring-boot"]
  }

  # UDP input for syslog-style logs
  udp {
    port => 5000
    codec => json_lines
    tags => ["spring-boot"]
  }

  # Beats input for Filebeat
  beats {
    port => 5044
  }
}

filter {
  # Parse Spring Boot logs
  if "spring-boot" in [tags] {
    # Add service name from the log
    if [logger_name] {
      mutate {
        add_field => { "service" => "%{[app_name]}" }
      }
    }
    
    # Parse timestamp
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }
    
    # Parse log level
    if [level] {
      mutate {
        add_field => { "log_level" => "%{level}" }
      }
    }
    
    # Extract exception details
    if [stack_trace] {
      mutate {
        add_field => { "has_exception" => "true" }
      }
    }
  }

  # Parse container logs
  if [docker] {
    mutate {
      add_field => { 
        "container_name" => "%{[docker][container][name]}"
        "container_id" => "%{[docker][container][id]}"
      }
    }
  }

  # Grok pattern for standard log format
  if ![message] and [log] {
    mutate {
      rename => { "log" => "message" }
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["host", "@version"]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "biblio-logs-%{+YYYY.MM.dd}"
    
    # Template for log index
    template_name => "biblio-logs"
    template_overwrite => true
  }

  # Debug output (remove in production)
  # stdout {
  #   codec => rubydebug
  # }
}
